{% from 'ui_macros.html' import project_card %}
{% if connect_form|default(false) %}<section class="panel form-panel"><form method="post" action="{{ url_for('workflow.connect_project') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label for="project-name">Project name</label><input id="project-name" name="name" maxlength="100" value="{{ request.form.get('name','') }}" placeholder="Optional"></div><div class="field"><label for="code_path">Application folder</label><input id="code_path" name="code_path" value="{{ request.form.get('code_path',default_path) }}" required></div><div class="field"><label for="adapter">Test environment</label><select id="adapter" name="adapter"><option value="budgetme">Django · BudgetMe</option><option value="python" {% if request.form.get('adapter')=='python' %}selected{% endif %}>Python · unittest</option></select></div><div class="actions"><a class="button secondary" href="{{ url_for('workflow.projects') }}">Cancel</a><button type="submit">Connect Project</button></div></form></section>
{% else %}<div class="project-grid">{% for project in projects %}{{ project_card(project) }}{% endfor %}<a class="connect-card" href="{{ url_for('workflow.connect_project') }}"><span aria-hidden="true">+</span>Connect New Project</a></div>{% endif %}
