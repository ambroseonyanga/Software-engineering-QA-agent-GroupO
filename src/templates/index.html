<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Agent</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
            color: #111827;
        }

        .container {
            max-width: 760px;
            margin: 60px auto;
            padding: 0 20px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(17, 24, 39, 0.04);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .button-row {
            margin-top: 16px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            padding: 12px 22px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .loading {
            margin-top: 20px;
            padding: 16px 18px;
            border-radius: 12px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            display: none;
        }

        .loading.visible {
            display: block;
        }

        .thinking {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #374151;
            font-size: 0.95rem;
            margin: 0;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            min-width: 24px;
        }

        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6b7280;
            display: inline-block;
            animation: blink 1.2s infinite ease-in-out;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        .result {
            margin-top: 24px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
        }

        .result h2 {
            margin: 0 0 12px;
            font-size: 1.1rem;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #111827;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QA Agent</h1>

        <form method="POST" id="qa-form">
            <div class="box">
                <label for="requirement">Requirement</label>
                <textarea id="requirement" name="requirement" placeholder="Enter your requirement here...">{{ requirement }}</textarea>

                <div class="button-row">
                    <button type="submit">Analyze It</button>
                </div>
            </div>
        </form>

        <div class="loading" id="loading" aria-live="polite">
            <p class="thinking">
                <span>Thinking</span>
                <span class="dots"><span></span><span></span><span></span></span>
            </p>
        </div>

        {% if result %}
        <section class="result" id="result-panel">
            <h2>Answer</h2>
            <pre>{{ result }}</pre>
        </section>
        {% endif %}
    </div>

    <script>
        const form = document.getElementById('qa-form');
        const loading = document.getElementById('loading');
        const button = form.querySelector('button');
        const resultPanel = document.getElementById('result-panel');

        form.addEventListener('submit', function () {
            if (resultPanel) {
                resultPanel.style.display = 'none';
            }
            loading.classList.add('visible');
            button.disabled = true;
            button.textContent = 'Analyzing...';
        });
    </script>
</body>
</html>
