<header class="section-heading"><h2>Project Knowledge</h2></header>
<section class="panel knowledge-panel"><p class="muted">Ask about this project’s requirements, code, tests, execution results or issue drafts.</p>
<form id="knowledge-form" data-session="{{ state.id }}"><div class="field"><label for="knowledge-question">Your question</label><textarea id="knowledge-question" maxlength="2000" required placeholder="What does this project do? Which requirements still need tests?"></textarea></div><button type="submit">Ask about Project</button></form>
<p id="knowledge-status" class="hint" role="status" aria-live="polite"></p><div id="knowledge-conversation" aria-label="Questions and answers"></div>
<p class="hint">Answers use selected saved project records and source excerpts. The answer will indicate when evidence is missing.</p></section>
